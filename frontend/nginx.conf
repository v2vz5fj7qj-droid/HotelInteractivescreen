# ════════════════════════════════════════════════════════════
#  ConnectBé — nginx (production)
#  Sert le build statique + proxifie /api et /uploads vers le backend.
# ════════════════════════════════════════════════════════════

upstream connectbe_backend {
    server backend:4000;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Uploads d'images depuis le backoffice (logos, photos POI…)
    client_max_body_size 25m;

    # ── Compression ─────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # ── Sonde de santé (HEALTHCHECK Docker) ─────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ── API : proxy vers le backend Node ────────────────────
    location /api/ {
        proxy_pass         http://connectbe_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }

    # ── Fichiers uploadés (servis par le backend) ───────────
    location /uploads/ {
        proxy_pass       http://connectbe_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires          7d;
        add_header       Cache-Control "public";
    }

    # ── Assets hashés par Vite : immuables ──────────────────
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ── Jamais de cache : sinon une borne peut rester bloquée
    #    sur une ancienne version après un déploiement.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # ── Fallback SPA (React Router) ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
