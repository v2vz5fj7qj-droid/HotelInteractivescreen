services:

  mysql:
    image: mysql:8.0
    container_name: connectbe_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_NAME}
      MYSQL_USER:          ${DB_USER}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    ports:
      - "3307:3306"    # 3306 déjà utilisé par un autre conteneur MySQL
    volumes:
      - mysql_data:/var/lib/mysql
      # Joués une seule fois, sur un volume mysql_data vierge.
      # 01 — schéma complet (structure seule)
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
      # 02 — données de référence : hôtel #1, super-admin, catégories, thème
      - ./database/seeds/bootstrap.sql:/docker-entrypoint-initdb.d/02_bootstrap.sql
      # 03 — données réelles exportées via scripts/db-export.sh (REPLACE INTO).
      #      Commenter cette ligne pour déployer sur une base vierge.
      - ./database/seeds/data_live.sql:/docker-entrypoint-initdb.d/03_data_live.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - connectbe_net

  redis:
    image: redis:7-alpine
    container_name: connectbe_redis
    restart: unless-stopped
    ports:
      - "6380:6379"    # 6379 déjà pris — exposé sur 6380 pour le dev local
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - connectbe_net

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: connectbe_libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: fr,en,de,es,pt,ar,zh,ja,ru
      LT_DISABLE_WEB_UI: "true"
    volumes:
      - libretranslate_data:/home/libretranslate/.local
    networks:
      - connectbe_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connectbe_backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "4001:4000"    # 4000 déjà utilisé
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      libretranslate:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/uploads          # fichiers uploadés (logos, images POI…)
      - /app/node_modules
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - connectbe_net

  # PRODUCTION : build statique servi par nginx, qui proxifie /api et /uploads
  # vers le backend. Pour le développement (serveur Vite + HMR) :
  #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
      # Vite inline les VITE_* au moment du build : ce sont des build args,
      # pas des variables d'environnement d'exécution. Changer l'une d'elles
      # impose un `docker compose build frontend`.
      args:
        VITE_HOTEL_LAT: ${HOTEL_LAT}
        VITE_HOTEL_LNG: ${HOTEL_LNG}
        VITE_HOTEL_NAME: ${HOTEL_NAME}
        VITE_IDLE_TIMEOUT_MS: ${IDLE_TIMEOUT_MS}
        VITE_CARTO_API_KEY: ${VITE_CARTO_API_KEY}
    container_name: connectbe_frontend
    restart: unless-stopped
    ports:
      - "5173:80"      # port hôte inchangé : nginx écoute sur 80 dans le conteneur
    depends_on:
      - backend
    networks:
      - connectbe_net

volumes:
  mysql_data:
  redis_data:
  libretranslate_data:

networks:
  connectbe_net:
    driver: bridge
